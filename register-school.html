<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register School — ACCESS UG</title><style>body{margin:0;font-family:Inter,system-ui;background:#f4f7fb;color:#10233f}.wrap{max-width:980px;margin:auto;padding:28px 16px}.brand{color:#fff;background:linear-gradient(135deg,#071b3a,#1769d2);padding:28px;border-radius:18px;box-shadow:0 20px 50px #071b3a25}.card{background:#fff;border:1px solid #d9e4f1;border-radius:18px;padding:24px;margin-top:18px;box-shadow:0 12px 30px #071b3a12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd8e8;border-radius:9px}.plan{display:grid;grid-template-columns:1fr 1fr;gap:14px}.plan label{border:1px solid #d9e4f1;padding:18px;border-radius:14px}.plan input{width:auto}.btn{padding:12px 18px;border:0;border-radius:10px;background:#1769d2;color:#fff;font-weight:700}.muted{color:#64748b}@media(max-width:700px){.grid,.plan{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="brand"><h1>ACCESS UG</h1><p>Register your school</p><span>Secure school management for students, teachers and administrators.</span></div><div class="card"><h2>School details</h2><p class="muted">Complete the same core school information used by the ACCESS UG administrator.</p><form id="reg"><div class="grid"><div><label>School name</label><input name="school_name" required></div><div><label>School code</label><input name="school_code" required></div><div><label>District</label><input name="district" required></div><div><label>Location</label><input name="location"></div><div><label>Head teacher</label><input name="head_teacher" required></div><div><label>School phone</label><input name="phone" required></div><div><label>School email</label><input name="email" type="email" required></div><div><label>School type</label><select name="school_type"><option>Secondary</option><option>Primary</option><option>Mixed</option></select></div><div><label>Estimated users</label><input name="estimated_users" type="number" min="1" required></div><div><label>Admin login password</label><input name="password" type="password" minlength="6" required></div><div class="full"><h3>Choose your plan</h3><div class="plan"><label><input type="radio" name="plan_amount_ugx" value="50000" checked> <strong>UGX 50,000</strong><br><span class="muted">For fewer than 1,000 total users</span></label><label><input type="radio" name="plan_amount_ugx" value="100000"> <strong>UGX 100,000</strong><br><span class="muted">For 1,000+ total users</span></label></div></div><div class="full"><h3>Payment method</h3><select name="payment_method"><option>MTN Mobile Money</option><option>Airtel Money</option><option>Credit/Debit Card</option></select></div><div class="full"><button class="btn">Continue to payment</button></div></div></form><p id="msg" class="muted"></p></div><p style="text-align:center" class="muted">Developed and designed by Jovan Kaliisa</p></div><script>const f=document.getElementById('reg');f.onsubmit=e=>{e.preventDefault();const p=Object.fromEntries(new FormData(f));const amount=Number(p.estimated_users)>=1000?100000:50000;p.plan_amount_ugx=String(amount);document.getElementById('msg').textContent=`Payment step ready: ${p.payment_method} · UGX ${amount.toLocaleString()}. Payment verification will be required before the school account is activated.`};</script></body></html>
