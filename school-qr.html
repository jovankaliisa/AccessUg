<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACCESS UG — School QR</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>:root{--navy:#071b3a;--blue:#1769d2;--bg:#f5f7fb;--text:#10233f;--muted:#64748b;--line:#dce5f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text)}.wrap{max-width:620px;margin:auto;padding:20px}.brand{display:flex;gap:12px;align-items:center;margin:8px 0 20px}.logo{width:44px;height:44px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900}.brand span{display:block;color:var(--muted);font-size:12px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 14px 40px rgba(9,35,75,.09)}h1{font-size:25px;margin:0 0 6px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.school{margin:18px 0;padding:16px;background:#f7faff;border:1px solid var(--line);border-radius:15px}.school strong{display:block;font-size:18px}.qrbox{display:grid;place-items:center;padding:20px;background:#fff;border:1px dashed #b9c8da;border-radius:18px;margin:18px 0}.qrbox canvas,.qrbox img{max-width:100%;height:auto}.meta{text-align:center;color:var(--muted);font-size:12px}.actions{display:flex;gap:10px;margin-top:18px}.btn{flex:1;border:0;border-radius:11px;padding:12px;background:var(--blue);color:#fff;font-weight:800}.btn.secondary{background:#edf3fa;color:var(--text)}.status{margin-top:15px;padding:12px;border-radius:11px;background:#f4f7fb;color:var(--muted);font-size:13px}.error{background:#fff1f2;color:#b42318}@media(max-width:480px){.wrap{padding:12px}.card{padding:18px}.actions{flex-direction:column}}</style></head><body><div class="wrap"><div class="brand"><div class="logo">AU</div><div><strong>ACCESS UG</strong><span>School attendance QR</span></div></div><div class="card"><h1>School Attendance QR</h1><div class="muted">Display this official QR code where teachers can scan it when checking in. Only the current active code works.</div><div id="school" class="school"><strong>Loading school…</strong></div><div id="qr" class="qrbox"></div><div id="meta" class="meta"></div><div class="actions"><button class="btn" id="download">Download QR</button><button class="btn secondary" onclick="window.print()">Print</button></div><div id="status" class="status">Loading your current school QR…</div></div></div><script>const SB=supabase.createClient("https://iotmozwesvmieqvsonov.supabase.co","sb_publishable_4dKiWSMcl6wCe5Nn6m0mcQ_Vi8HiSZZ",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let qrUrl="",schoolName="School";async function load(){try{const s=(await SB.auth.getSession()).data?.session;if(!s)throw new Error("Please sign in to your ACCESS UG school account.");const r=await SB.rpc("get_my_school_qr");if(r.error)throw r.error;const row=Array.isArray(r.data)?r.data[0]:r.data;if(!row)throw new Error("No active school QR is available yet.");schoolName=row.school_name||"School";qrUrl=row.qr_url;document.getElementById("school").innerHTML='<strong>'+schoolName+'</strong><span>'+((row.school_code||"")?"School code: "+row.school_code:"")+'</span>';document.getElementById("meta").textContent="QR version "+row.version+" • Generated "+new Date(row.generated_at).toLocaleString();new QRCode(document.getElementById("qr"),{text:qrUrl,width:280,height:280,colorDark:"#071b3a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});document.getElementById("status").textContent="Current QR loaded. You can download or print it."}catch(e){document.getElementById("status").textContent=e.message||"Could not load the school QR.";document.getElementById("status").className="status error"}}document.getElementById("download").onclick=()=>{const img=document.querySelector("#qr img");const canvas=document.querySelector("#qr canvas");const src=img?.src||canvas?.toDataURL("image/png");if(!src)return;const a=document.createElement("a");a.href=src;a.download=schoolName.replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-access-ug-qr.png";a.click()};load();</script></body></html>
