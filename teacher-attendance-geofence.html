<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ACCESS UG — Teacher Attendance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial,sans-serif;background:#f3f6fb;color:#172b4d;margin:0}.wrap{max-width:620px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #dfe7f2;border-radius:16px;padding:24px;box-shadow:0 8px 25px rgba(6,26,56,.08)}h1{margin-top:0;color:#0b3d82}.muted{color:#718096;font-size:13px}.status{margin:18px 0;padding:14px;border-radius:10px;background:#edf4ff;color:#174d8f;display:none}.status.show{display:block}.status.ok{background:#e7f7f0;color:#116d50}.status.err{background:#fdebea;color:#9d2e29}.btn{border:0;background:#0b3d82;color:#fff;padding:13px 18px;border-radius:10px;font-weight:bold;cursor:pointer;width:100%}.btn:disabled{opacity:.6;cursor:not-allowed}.info{display:grid;gap:9px;margin:18px 0}.row{display:flex;justify-content:space-between;gap:15px;background:#f8fafd;padding:11px 12px;border-radius:9px;font-size:13px}.row span{color:#718096}.row strong{text-align:right}</style>
</head><body><div class="wrap"><div class="card"><h1>Teacher Attendance</h1><p class="muted">Attendance is verified using your device GPS and the school's registered attendance area.</p><div id="status" class="status"></div><div class="info"><div class="row"><span>School</span><strong id="school">Loading…</strong></div><div class="row"><span>Allowed radius</span><strong id="radius">—</strong></div><div class="row"><span>GPS</span><strong id="gps">Not checked</strong></div></div><button id="clockIn" class="btn" onclick="clockIn()">Check location &amp; Mark Present</button></div></div>
<script>
const SUPABASE_URL='https://iotmozwesvmieqvsonov.supabase.co';
const SUPABASE_KEY='sb_publishable_4dKiWSMcl6wCe5Nn6m0mcQ_Vi8HiSZZ';
const SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function msg(text,type=''){const e=$('status');e.textContent=text;e.className='status show '+type}
async function getTeacher(){const {data:{user}}=await SB.auth.getUser();if(!user)throw new Error('Please sign in first.');let q=await SB.from('teachers').select('id,school_id,first_name,last_name,auth_user_id').eq('auth_user_id',user.id).maybeSingle();if(q.error)throw q.error;if(!q.data)q=await SB.from('teachers').select('id,school_id,first_name,last_name,auth_user_id').eq('id',user.id).maybeSingle();if(q.error)throw q.error;if(!q.data)throw new Error('Teacher profile not found.');return q.data}
async function load(){try{const t=await getTeacher();const {data:s,error}=await SB.from('schools').select('name,latitude,longitude,attendance_radius_meters,geofence_enabled').eq('id',t.school_id).single();if(error)throw error;if(s.latitude==null||s.longitude==null)throw new Error('Your school has not configured its attendance location yet.');$('school').textContent=s.name||'School';$('radius').textContent=(s.attendance_radius_meters||150)+' m';window.school=s;window.teacher=t}catch(e){msg(e.message,'err');$('clockIn').disabled=true}}
function locate(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('GPS is not supported on this device.'));navigator.geolocation.getCurrentPosition(resolve,e=>reject(new Error(e.code===1?'Location permission was denied. Please allow GPS access.':e.code===2?'Your location could not be determined.':e.code===3?'GPS request timed out.':'Unable to get your location.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}
async function clockIn(){const b=$('clockIn');b.disabled=true;msg('Requesting your current GPS location…','');try{if(!window.school)await load();const p=await locate();$('gps').textContent=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);msg('Location found. Verifying you are inside the school attendance area…','');const {data,error}=await SB.rpc('clock_in_teacher_with_location',{p_lat:p.coords.latitude,p_lng:p.coords.longitude,p_accuracy:p.coords.accuracy??null});if(error)throw error;msg('Attendance marked PRESENT successfully. Your location was verified.','ok');b.textContent='Present — Verified';}catch(e){msg(e.message||'Attendance could not be marked.','err');b.disabled=false}}
load();
</script></body></html>
