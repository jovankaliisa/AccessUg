name: Fix teacher GPS verification

on:
  push:
    paths:
      - '.github/workflows/fix-gps-timeout.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair GPS verification function
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('teacher-dashboard.html')
          s = p.read_text(encoding='utf-8')

          # Repair the malformed block left by the previous time-window cleanup.
          s = s.replace(
              '''  const now=new Date();\nreturn;\n  }\n\n  if(!navigator.geolocation){''',
              '''  // No time-of-day restriction: teachers can verify attendance at any time.\n\n  if(!navigator.geolocation){'''
          )

          # Ensure the GPS request cannot hang indefinitely and gives a clearer mobile message.
          s = s.replace(
              '{enableHighAccuracy:true,timeout:20000,maximumAge:0});',
              '{enableHighAccuracy:true,timeout:30000,maximumAge:0});'
          )

          # If a previous edit removed the closing/initialization flow, fail visibly instead of staying stuck.
          if 'async function verifyTeacherLocation()' not in s:
              raise SystemExit('verifyTeacherLocation function missing')
          if 'navigator.geolocation.getCurrentPosition' not in s:
              raise SystemExit('GPS request missing')

          p.write_text(s, encoding='utf-8')

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-gps-timeout.yml
          git add teacher-dashboard.html .github/workflows/fix-gps-timeout.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix teacher GPS verification timeout"
          git push
