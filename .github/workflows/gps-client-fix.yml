name: GPS client fix

on:
  push:
    paths:
      - '.github/workflows/gps-client-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch teacher GPS handling
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('teacher-dashboard.html')
          s = p.read_text(encoding='utf-8')

          original = s

          # The browser's accuracy estimate can legitimately exceed 100m indoors.
          # Allow up to 250m client-side; the Supabase RPC independently applies
          # the conservative distance + uncertainty safety check.
          s = s.replace('accuracy > 100', 'accuracy > 250')
          s = s.replace('over 100 m', 'over 250 m')
          s = s.replace('timeout:30000', 'timeout:60000')

          # Make the client error explain the real safety rule if the old text exists.
          s = s.replace(
              'GPS accuracy is insufficient (over 250 m). Turn on high-accuracy location and try again.',
              'GPS accuracy is still too low (over 250 m). Move near a window or outdoors, keep Google Location Accuracy on, and try again.'
          )

          if s == original:
              raise SystemExit('No GPS client pattern was found; refusing to commit an unverified change.')

          p.write_text(s, encoding='utf-8')

      - name: Remove obsolete failed workflow
        run: rm -f .github/workflows/gps-retry-fix.yml

      - name: Commit changes and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/gps-client-fix.yml
          git add teacher-dashboard.html .github/workflows/gps-retry-fix.yml .github/workflows/gps-client-fix.yml
          git commit -m 'Make teacher GPS verification reliable' || exit 0
          git push
