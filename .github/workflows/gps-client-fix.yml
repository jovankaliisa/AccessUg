name: Teacher GPS and dashboard polish

on:
  push:
    paths:
      - '.github/workflows/gps-client-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply reliable GPS acquisition and assignment cards
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('teacher-dashboard.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Mobile browsers can legitimately report several hundred metres of uncertainty.
          # The database is still the security authority and applies distance + uncertainty <= radius.
          s = s.replace('accuracy > 250', 'accuracy > 500')
          s = s.replace('over 250 m', 'over 500 m')
          s = s.replace('over 250 m). Turn on high-accuracy location and try again.', 'over 500 m). Move near a window or outdoors, keep Location Accuracy on, and try again.')

          # Replace the single-shot browser GPS request with progressive acquisition:
          # quick network-assisted fix first, then watchPosition for a better fix.
          robust = r'''async function verifyTeacherLocation(){
            const btn=$("verifyLocationBtn");
            const status=$("teacherLocationStatus");
            if(!btn)return;
            if(!navigator.geolocation){
              if(status){status.textContent="Location services are not available in this browser.";status.className="teacher-location-status error";}
              return;
            }

            btn.disabled=true;
            btn.textContent="📍 Finding your location…";
            if(status){status.textContent="Getting a quick location fix…";status.className="teacher-location-status info";}

            const deadline=Date.now()+60000;
            let watchId=null;
            let finished=false;
            let best=null;
            let lastGeoError=null;

            const cleanup=()=>{if(watchId!==null){try{navigator.geolocation.clearWatch(watchId);}catch(_){ }watchId=null;}};
            const fail=(message)=>{
              cleanup();
              finished=true;
              if(status){status.textContent=message;status.className="teacher-location-status error";}
              btn.disabled=false;
              btn.textContent="📍 Verify Location & Check In";
            };

            const submitPosition=async(pos)=>{
              if(finished)return false;
              const lat=Number(pos?.coords?.latitude);
              const lng=Number(pos?.coords?.longitude);
              const accuracy=Number(pos?.coords?.accuracy);
              const gpsTimestamp=Number(pos?.timestamp);
              if(!Number.isFinite(lat)||!Number.isFinite(lng)||!Number.isFinite(accuracy)||accuracy<0)return false;
              if(Number.isFinite(gpsTimestamp)&&Math.abs(Date.now()-gpsTimestamp)>120000)return false;
              if(accuracy>500)return false;

              if(status){
                status.textContent=`Location found (${Math.round(accuracy)} m accuracy). Securely checking the school boundary…`;
                status.className="teacher-location-status info";
              }

              try{
                const r=await supabaseClient.rpc("clock_in_teacher_with_location",{
                  p_lat:lat,
                  p_lng:lng,
                  p_accuracy:accuracy
                });
                if(r.error)throw r.error;

                const row=Array.isArray(r.data)?r.data[0]:r.data;
                const distance=Number(row?.distance_from_school_meters);
                const radius=Number(row?.attendance_radius_meters);
                finished=true;
                cleanup();
                $("clockStatus").textContent="GPS Verified";
                $("todayStatus").textContent="Present";
                if(status){
                  status.textContent=`Attendance granted ✓${Number.isFinite(distance)?` You are ${Math.round(distance)} m from the registered school point.`:""}${Number.isFinite(radius)?` Allowed radius: ${Math.round(radius)} m.`:""}${Number.isFinite(accuracy)?` GPS accuracy: about ${Math.round(accuracy)} m.`:""}`;
                  status.className="teacher-location-status ok";
                }
                toast("Location verified. Teacher attendance recorded.");
                await loadTeacherAttendance();
                btn.disabled=false;
                btn.textContent="✓ Location Verified";
                return true;
              }catch(e){
                const msg=e?.message||String(e);
                if(status){status.textContent="Location was found, but the school boundary could not be verified safely. Improving the GPS reading…";status.className="teacher-location-status info";}
                lastGeoError=new Error(msg);
                return false;
              }
            };

            const handlePosition=async(pos)=>{
              if(finished)return;
              const accuracy=Number(pos?.coords?.accuracy);
              if(!Number.isFinite(accuracy))return;
              if(!best||accuracy<Number(best.coords?.accuracy))best=pos;
              if(accuracy<=500){
                const accepted=await submitPosition(best);
                if(accepted)return;
              }
              if(Date.now()<deadline&&status){
                status.textContent=`Improving location accuracy automatically… current estimate ${Math.round(accuracy)} m`;
                status.className="teacher-location-status info";
              }
            };

            const startWatch=()=>{
              if(finished||watchId!==null)return;
              if(Date.now()>=deadline){
                fail(lastGeoError?.message||"Could not obtain a reliable location in time. Please move near a window or outdoors and try again.");
                return;
              }
              if(status){status.textContent="Improving location accuracy automatically… please keep this page open.";status.className="teacher-location-status info";}
              try{
                watchId=navigator.geolocation.watchPosition(
                  handlePosition,
                  err=>{
                    lastGeoError=err;
                    if(Date.now()>=deadline)fail("GPS could not produce a reliable reading. Please move near a window or outdoors and try again.");
                  },
                  {enableHighAccuracy:true,timeout:50000,maximumAge:10000}
                );
              }catch(e){fail("This browser could not start location tracking. Please reopen the page and try again.");}
            };

            try{
              const quick=await new Promise((resolve,reject)=>{
                navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,timeout:10000,maximumAge:30000});
              });
              await handlePosition(quick);
              if(finished)return;
            }catch(e){lastGeoError=e;}

            startWatch();
            const timer=setInterval(()=>{
              if(finished){clearInterval(timer);return;}
              if(Date.now()>=deadline){
                clearInterval(timer);
                const a=Number(best?.coords?.accuracy);
                fail(Number.isFinite(a)&&a>500
                  ? `The phone is still reporting a very uncertain location (${Math.round(a)} m). Move near a window or outdoors and try again.`
                  : "GPS could not produce a reliable reading within 60 seconds. Please move near a window or outdoors and try again.");
              }
            },1000);
          }

          pattern = re.compile(r'async function verifyTeacherLocation\(\)\{.*?\n\}\n\n\$\("verifyLocationBtn"\)\?\.addEventListener\("click",verifyTeacherLocation\);', re.S)
          replacement = robust + '\n\n$("verifyLocationBtn")?.addEventListener("click",verifyTeacherLocation);'
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Could not locate verifyTeacherLocation(); refusing to commit.')

          # Replace the old one-line assignment summary with a mobile-first card list.
          old_markup = '<div style="margin-top:18px" class="muted"><strong>Assigned classes & subjects:</strong> <span id="assignedClasses">Loading...</span></div>'
          new_markup = '''<div class="teacher-assignments" style="margin-top:18px">
            <div class="teacher-assignments-head"><div><strong>My Teaching</strong><div class="muted">Your assigned classes and subjects</div></div><span class="teacher-assignment-count" id="assignedClassCountBadge">—</span></div>
            <div id="assignedClasses" class="teacher-assignment-list"><div class="teacher-assignment-loading">Loading assignments…</div></div>
          </div>'''
          if old_markup not in s:
              raise SystemExit('Could not locate old assignment summary markup; refusing to commit.')
          s=s.replace(old_markup,new_markup,1)

          old_summary = '''  const summaries=classes.map(c=>{
    const subs=subjects.filter(s=>assignedSubjectIds(c.id).includes(String(s.id))).map(itemLabel);
    return subs.length?`${className(c)} — ${subs.join(", ")}`:className(c);
  });
  $("assignedClasses").textContent=summaries.length?summaries.join(" | "):"No active assignments";
  $("classCount").textContent=classes.length;'''
          new_summary = '''  const assignmentHost=$("assignedClasses");
  const grouped=classes.map(c=>{
    const subs=subjects.filter(s=>assignedSubjectIds(c.id).includes(String(s.id)));
    return {c,subs};
  }).filter(x=>x.subs.length||x.c);
  if(assignmentHost){
    assignmentHost.innerHTML=grouped.length?grouped.map(({c,subs})=>{
      const labels=subs.map(itemLabel);
      const visible=labels.slice(0,8);
      const extra=Math.max(0,labels.length-visible.length);
      return `<div class="teacher-assignment-card">
        <div class="teacher-assignment-card-top"><div class="teacher-class-name">${esc(className(c))}</div><span class="teacher-subject-count">${labels.length} subject${labels.length===1?"":"s"}</span></div>
        <div class="teacher-subject-chips">${visible.map(x=>`<span class="teacher-subject-chip">${esc(x)}</span>`).join("")}${extra?`<span class="teacher-subject-chip more">+${extra} more</span>`:""}</div>
      </div>`;
    }).join(""):'<div class="teacher-assignment-empty">No active class assignments.</div>';
  }
  const badge=$("assignedClassCountBadge");if(badge)badge.textContent=`${classes.length} class${classes.length===1?"":"es"}`;
  $("classCount").textContent=classes.length;'''
          if old_summary not in s:
              raise SystemExit('Could not locate assignment summary code; refusing to commit.')
          s=s.replace(old_summary,new_summary,1)

          css='''
<style id="teacher-assignment-polish">
.teacher-assignments{border-top:1px solid rgba(255,255,255,.12);padding-top:16px}.teacher-assignments-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;color:#fff}.teacher-assignments-head strong{font-size:14px}.teacher-assignments-head .muted{color:#c8d8ee;margin-top:3px}.teacher-assignment-count{font-size:11px;font-weight:800;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);padding:6px 9px;border-radius:999px;white-space:nowrap}.teacher-assignment-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.teacher-assignment-card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px}.teacher-assignment-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.teacher-class-name{font-weight:850;color:#fff;font-size:14px}.teacher-subject-count{font-size:10px;font-weight:800;color:#d7e6fa;background:rgba(255,255,255,.1);padding:4px 7px;border-radius:999px;white-space:nowrap}.teacher-subject-chips{display:flex;flex-wrap:wrap;gap:6px}.teacher-subject-chip{display:inline-flex;align-items:center;max-width:100%;padding:5px 8px;border-radius:999px;background:#fff;color:#18375f;font-size:10px;font-weight:750;line-height:1.15}.teacher-subject-chip.more{background:#dceafb;color:#0b3d82}.teacher-assignment-loading,.teacher-assignment-empty{font-size:12px;color:#d4e2f3;padding:10px 0}.teacher-location-status{margin-top:10px}.teacher-location-status.info{color:#174d8f}.teacher-location-status.ok{color:#117052}.teacher-location-status.error{color:#a52f2b}@media(max-width:700px){.teacher-assignment-list{grid-template-columns:1fr}.teacher-assignment-card{padding:11px}.teacher-subject-chip{font-size:10px}}
</style>
'''
          if 'id="teacher-assignment-polish"' not in s:
              s=s.replace('</head>',css+'</head>',1)

          if s == original:
              raise SystemExit('No changes were produced; refusing to commit.')
          p.write_text(s,encoding='utf-8')

      - name: Commit and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/gps-client-fix.yml .github/workflows/gps-retry-fix.yml
          git add teacher-dashboard.html .github/workflows/gps-client-fix.yml .github/workflows/gps-retry-fix.yml
          git commit -m 'Improve teacher GPS reliability and dashboard UI' || exit 0
          git push
