name: Set ACCESS UG favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add favicon link to index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<link rel="icon" href="favicon.svg" type="image/svg+xml">'
          if marker not in s:
              s = s.replace('</head>', f'    {marker}\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit favicon link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add ACCESS UG favicon to site"
          git push