name: GPS permission fix
on:
  push:
    paths:
      - '.github/workflows/gps-permission-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch GPS handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('teacher-dashboard.html')
          s=p.read_text(encoding='utf-8')
          old='''  btn.disabled=true;\n  btn.textContent="Checking GPS location…";'''
          new='''  btn.disabled=true;\n  btn.textContent="Checking GPS location…";\n\n  if(navigator.permissions && navigator.permissions.query){\n    try{\n      const permission=await navigator.permissions.query({name:"geolocation"});\n      if(permission.state==="denied"){\n        if(status){status.textContent="Location is blocked for this site. In Chrome open Site settings → Location → Allow, then try again.";status.className="teacher-location-status error";}\n        btn.disabled=false;\n        btn.textContent="📍 Verify Location & Check In";\n        return;\n      }\n      if(permission.state==="granted" && status){\n        status.textContent="Location permission is already allowed. Getting a fresh GPS position…";\n        status.className="teacher-location-status info";\n      }\n    }catch(_){ }\n  }'''
          if old not in s:
              raise SystemExit('GPS button block not found')
          s=s.replace(old,new,1)
          s=s.replace('timeout:30000,maximumAge:0','timeout:45000,maximumAge:0',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/gps-permission-fix.yml
          git add teacher-dashboard.html .github/workflows/gps-permission-fix.yml
          git commit -m "Improve GPS permission and timeout handling" || exit 0
          git push
