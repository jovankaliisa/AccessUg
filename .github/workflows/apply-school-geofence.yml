name: Apply ACCESS UG school geofence integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'Apply school geofence integration [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch dashboards
        env:
          SUPABASE_URL: https://iotmozwesvmieqvsonov.supabase.co
        run: |
          python3 <<'PY'
          from pathlib import Path

          admin = Path('admin-dashboard.html')
          s = admin.read_text(encoding='utf-8')

          if 'id="schoolLatitude"' not in s:
              marker = '            <div class="class-builder">'
              geo = '''            <div class="geofence-builder" style="margin-top:20px;padding:18px;border:1px solid #d8e5f3;border-radius:14px;background:#f7fbff;">
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
                      <div>
                          <h4 style="margin:0;color:#102a56;font-size:16px;">School Attendance Location</h4>
                          <p class="muted" style="margin:5px 0 0;">Register the physical school location used to verify teacher attendance. GPS coordinates are the attendance source of truth.</p>
                      </div>
                      <button type="button" class="add-class-btn" id="useSchoolCurrentLocationBtn">📍 Use current location</button>
                  </div>
                  <div class="formgrid" style="margin-top:14px;">
                      <div class="field">
                          <label>Latitude *</label>
                          <input id="schoolLatitude" type="number" step="any" min="-90" max="90" placeholder="e.g. 0.3476">
                      </div>
                      <div class="field">
                          <label>Longitude *</label>
                          <input id="schoolLongitude" type="number" step="any" min="-180" max="180" placeholder="e.g. 32.5825">
                      </div>
                      <div class="field">
                          <label>Attendance radius (metres) *</label>
                          <input id="schoolAttendanceRadius" type="number" min="25" max="2000" step="1" value="150" required>
                      </div>
                      <div class="field">
                          <label>Google Maps location</label>
                          <button type="button" class="secondary" id="openSchoolMapsBtn" style="width:100%;padding:11px;border-radius:8px;">🗺 Open in Google Maps</button>
                      </div>
                  </div>
                  <div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                      <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#304866;">
                          <input id="schoolGeofenceEnabled" type="checkbox" checked style="width:18px;height:18px;">
                          Require location verification for teacher attendance
                      </label>
                      <span id="schoolLocationStatus" class="muted">No location captured yet.</span>
                  </div>
                  <div class="hint">Tip: stand at the school entrance or another approved attendance point before pressing “Use current location”.</div>
              </div>

'''
              if marker not in s:
                  raise SystemExit('ADMIN_PATCH_FAILED: class-builder marker not found')
              s = s.replace(marker, geo + marker, 1)

          start = s.find('        const school = {')
          end = s.find('        };', start)
          if start == -1 or end == -1:
              raise SystemExit('ADMIN_PATCH_FAILED: school object not found')
          block = s[start:end+10]
          if 'latitude:' not in block:
              old = '''            school_type: document.getElementById("schoolType").value,
            status: "Active",
            created_by: user.id'''
              new = '''            school_type: document.getElementById("schoolType").value,
            latitude: (() => { const v=document.getElementById("schoolLatitude")?.value; return v==="" ? null : Number(v); })(),
            longitude: (() => { const v=document.getElementById("schoolLongitude")?.value; return v==="" ? null : Number(v); })(),
            attendance_radius_meters: Number(document.getElementById("schoolAttendanceRadius")?.value || 150),
            geofence_enabled: !!document.getElementById("schoolGeofenceEnabled")?.checked,
            google_maps_url: (() => { const lat=document.getElementById("schoolLatitude")?.value; const lng=document.getElementById("schoolLongitude")?.value; return lat!=="" && lng!=="" ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${lat},${lng}`)}` : null; })(),
            location_verified_at: document.getElementById("schoolLatitude")?.value && document.getElementById("schoolLongitude")?.value ? new Date().toISOString() : null,
            status: "Active",
            created_by: user.id'''
              if old not in block:
                  raise SystemExit('ADMIN_PATCH_FAILED: school payload anchor not found')
              block = block.replace(old, new, 1)
              s = s[:start] + block + s[end+10:]

          js_marker = 'const studentSchoolElement = document.getElementById("studentSchool");'
          if 'useSchoolCurrentLocationBtn' not in s[s.find('</script>'):]:
              pass
          if 'function initSchoolGeofenceUI()' not in s:
              helper = '''
/* =========================
   SCHOOL ATTENDANCE GEOFENCE
========================= */
function initSchoolGeofenceUI(){
    const lat=document.getElementById('schoolLatitude');
    const lng=document.getElementById('schoolLongitude');
    const radius=document.getElementById('schoolAttendanceRadius');
    const enabled=document.getElementById('schoolGeofenceEnabled');
    const status=document.getElementById('schoolLocationStatus');
    const current=document.getElementById('useSchoolCurrentLocationBtn');
    const maps=document.getElementById('openSchoolMapsBtn');
    if(!lat||!lng||!radius||!enabled||!status||!current||!maps)return;
    const updateStatus=()=>{
        const a=Number(lat.value),b=Number(lng.value);
        status.textContent=Number.isFinite(a)&&Number.isFinite(b)?`Location ready · radius ${Number(radius.value||150)} m`:'No location captured yet.';
    };
    [lat,lng,radius,enabled].forEach(e=>e.addEventListener('input',updateStatus));
    current.addEventListener('click',()=>{
        if(!navigator.geolocation){ status.textContent='This browser does not support GPS.'; return; }
        current.disabled=true; current.textContent='📍 Getting GPS…'; status.textContent='Requesting high-accuracy location…';
        navigator.geolocation.getCurrentPosition(pos=>{
            lat.value=pos.coords.latitude.toFixed(7); lng.value=pos.coords.longitude.toFixed(7);
            status.textContent=`GPS captured · accuracy ±${Math.round(pos.coords.accuracy||0)} m`;
            current.disabled=false; current.textContent='📍 Use current location';
        },err=>{
            status.textContent='GPS error: '+(err.message||'Unable to read location');
            current.disabled=false; current.textContent='📍 Use current location';
        },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
    });
    maps.addEventListener('click',()=>{
        const a=Number(lat.value),b=Number(lng.value);
        if(!Number.isFinite(a)||!Number.isFinite(b)){ status.textContent='Enter or capture latitude and longitude first.'; return; }
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${a},${b}`)}`,'_blank','noopener');
    });
    updateStatus();
}

'''
              anchor = '/* =========================\n   ADD SCHOOL\n========================= */'
              if anchor not in s: raise SystemExit('ADMIN_PATCH_FAILED: add-school anchor not found')
              s=s.replace(anchor, helper+anchor, 1)
              oldopen='''    loadSchoolSubjectCatalog();
    document.getElementById("modal").classList.add("show");'''
              newopen='''    loadSchoolSubjectCatalog();
    initSchoolGeofenceUI();
    document.getElementById("modal").classList.add("show");'''
              if oldopen in s: s=s.replace(oldopen,newopen,1)

          admin.write_text(s,encoding='utf-8')

          teacher = Path('teacher-dashboard.html')
          t = teacher.read_text(encoding='utf-8')

          if 'id="teacherLocationStatus"' not in t:
              marker = '''  <div class="card">
    <div class="toolbar">
      <div class="field"><label>Class</label><select id="attendanceClass"></select></div>'''
              insert = '''  <div class="card" style="margin-bottom:18px;border:1px solid #cfe0f5;background:#f7fbff;">
    <div class="card-head"><div><h3>Teacher Check-in Location</h3><div class="muted">Your Present status is verified against the school's registered GPS location.</div></div><span id="teacherLocationBadge" class="badge active">Checking</span></div>
    <div id="teacherLocationStatus" class="hint">When you clock in, ACCESS UG will request high-accuracy GPS and verify your distance from the school.</div>
    <div class="actions"><button class="btn success" id="verifyTeacherLocationBtn" type="button">📍 Verify location & Mark Present</button></div>
  </div>

'''
              if marker not in t: raise SystemExit('TEACHER_PATCH_FAILED: attendance marker not found')
              t=t.replace(marker,insert+marker,1)

          old_func_start=t.find('async function automaticTeacherAttendance(){')
          old_func_end=t.find('\n}\n\nasync function loadTeacherAttendance()',old_func_start)
          if old_func_start==-1 or old_func_end==-1: raise SystemExit('TEACHER_PATCH_FAILED: automatic attendance function not found')
          new_func='''async function clockInTeacherWithLocation(showFeedback=true){
  if(!teacher?.id)throw new Error('Teacher profile is not loaded.');
  if(!navigator.geolocation)throw new Error('This browser does not support GPS location.');
  const statusEl=$("teacherLocationStatus"),badge=$("teacherLocationBadge"),btn=$("verifyTeacherLocationBtn");
  if(showFeedback&&statusEl)statusEl.textContent='Requesting high-accuracy GPS…';
  if(badge){badge.textContent='Checking';badge.className='badge auth';}
  if(btn)btn.disabled=true;
  try{
    const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:20000,maximumAge:0}));
    const accuracy=Number(pos.coords.accuracy||0);
    if(showFeedback&&statusEl)statusEl.textContent=`GPS acquired · accuracy ±${Math.round(accuracy)} m. Verifying school boundary…`;
    const r=await supabaseClient.rpc('clock_in_teacher_with_location',{p_lat:pos.coords.latitude,p_lng:pos.coords.longitude,p_accuracy:accuracy||null});
    if(r.error)throw new Error(r.error.message||'Location verification failed.');
    const row=r.data;
    if(badge){badge.textContent='Present — Verified';badge.className='badge present';}
    $("clockStatus").textContent='Present'; $("todayStatus").textContent='Present';
    if(statusEl)statusEl.textContent=`✓ Present — school location verified. GPS accuracy ±${Math.round(accuracy)} m.`;
    if(showFeedback)toast('Your attendance was recorded after location verification.');
    return row;
  }catch(e){
    if(badge){badge.textContent='Not verified';badge.className='badge absent';}
    if(statusEl)statusEl.textContent='✕ Attendance not recorded: '+errorMessage(e);
    throw e;
  }finally{if(btn)btn.disabled=false;}
}

async function automaticTeacherAttendance(){
  const now=new Date(),hour=now.getHours();
  if(hour<6||hour>=10){
    $("clockStatus").textContent="Outside window"; $("todayStatus").textContent="—"; return;
  }
  const old=await supabaseClient.from("teacher_attendance").select("*").eq("teacher_id",teacher.id).eq("attendance_date",todayISO()).maybeSingle();
  if(old.error)throw old.error;
  if(old.data){
    $("clockStatus").textContent=old.data.location_verified?'Present — Verified':'Present';
    $("todayStatus").textContent='Present';
    return old.data;
  }
  return await clockInTeacherWithLocation(false);
}
'''
          t=t[:old_func_start]+new_func+t[old_func_end+2:]

          if 'verifyTeacherLocationBtn' in t and 'verifyTeacherLocationBtn")?.addEventListener' not in t:
              anchor='/* =========================\n   Login / initialization\n   ========================= */'
              handler='''$("verifyTeacherLocationBtn")?.addEventListener("click",async()=>{try{await clockInTeacherWithLocation(true);}catch(e){console.warn("Manual teacher location check:",e);}});

'''
              if anchor not in t: raise SystemExit('TEACHER_PATCH_FAILED: login anchor not found')
              t=t.replace(anchor,handler+anchor,1)

          teacher.write_text(t,encoding='utf-8')
          print('PATCHED dashboards successfully')
          PY

      - name: Commit changes
        run: |
          git config user.name "ACCESS UG"
          git config user.email "actions@users.noreply.github.com"
          git add admin-dashboard.html teacher-dashboard.html
          git diff --cached --quiet && { echo "No changes needed"; exit 0; }
          git commit -m "Apply school geofence integration [skip ci]"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/apply-school-geofence.yml || true
          git commit -m "Remove temporary geofence integration workflow [skip ci]" || true
          git push || true
