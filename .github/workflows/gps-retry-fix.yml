name: GPS retry fix

on:
  push:
    paths:
      - '.github/workflows/gps-retry-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add GPS accuracy retries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('teacher-dashboard.html')
          s=p.read_text()
          if 'let gpsAccuracyRetries=0;' not in s:
              s=s.replace('let terms=[];', 'let terms=[];\nlet gpsAccuracyRetries=0;')
          old='''      if(!Number.isFinite(accuracy) || accuracy < 0 || accuracy > 100){
        throw new Error("GPS accuracy is insufficient (over 100 m). Turn on high-accuracy location and try again.");
      }'''
          new='''      if(!Number.isFinite(accuracy) || accuracy < 0){
        throw new Error("The device returned an invalid GPS accuracy.");
      }
      if(accuracy > 100){
        if(gpsAccuracyRetries < 5){
          gpsAccuracyRetries++;
          if(status){
            status.textContent=`GPS accuracy is about ${Math.round(accuracy)} m. Retrying for a more precise GPS fix (${gpsAccuracyRetries}/5)…`;
            status.className="teacher-location-status info";
          }
          btn.disabled=false;
          btn.textContent="📍 Verify Location & Check In";
          setTimeout(verifyTeacherLocation,1500);
          return;
        }
        gpsAccuracyRetries=0;
        throw new Error(`GPS accuracy is still about ${Math.round(accuracy)} m. Turn on Android Location and Google Location Accuracy, then try again near a window or outdoors.`);
      }
      gpsAccuracyRetries=0;'''
          if old not in s:
              raise SystemExit('accuracy block not found')
          s=s.replace(old,new,1).replace('timeout:30000,maximumAge:0','timeout:60000,maximumAge:0',1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/gps-retry-fix.yml
          git add teacher-dashboard.html .github/workflows/gps-retry-fix.yml
          git commit -m "Retry teacher GPS until accurate fix" || true
          git push
